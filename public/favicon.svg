<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Page White Gradient -->
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Rounded Squircle Canvas Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer Golden Decorative Crescent Border Ribbon -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.4" stroke-dasharray="12 8" />

  <!-- Icon Group with Shadow -->
  <g filter="url(#shadow)">
    <!-- Book Base Stand (Rehal Pattern) -->
    <path d="M 120 370 L 256 420 L 392 370 L 370 340 L 256 380 L 142 340 Z" fill="url(#goldGrad)" opacity="0.9" />

    <!-- Open Quran Left Page -->
    <path d="M 256 160 C 210 135 150 140 100 165 L 100 335 C 150 310 210 305 256 330 Z" fill="url(#pageGrad)" stroke="#e2e8f0" stroke-width="3" />

    <!-- Open Quran Right Page -->
    <path d="M 256 160 C 302 135 362 140 412 165 L 412 335 C 362 310 302 305 256 330 Z" fill="url(#pageGrad)" stroke="#e2e8f0" stroke-width="3" />

    <!-- Book Center Binding Spine -->
    <path d="M 256 150 L 256 335" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" />

    <!-- Quran Verse Lines Left Page -->
    <line x1="135" y1="205" x2="225" y2="195" stroke="#047857" stroke-width="6" stroke-linecap="round" opacity="0.75" />
    <line x1="130" y1="240" x2="230" y2="230" stroke="#047857" stroke-width="6" stroke-linecap="round" opacity="0.75" />
    <line x1="135" y1="275" x2="220" y2="265" stroke="#047857" stroke-width="6" stroke-linecap="round" opacity="0.75" />

    <!-- Quran Verse Lines Right Page -->
    <line x1="287" y1="195" x2="377" y2="205" stroke="#047857" stroke-width="6" stroke-linecap="round" opacity="0.75" />
    <line x1="282" y1="230" x2="382" y2="240" stroke="#047857" stroke-width="6" stroke-linecap="round" opacity="0.75" />
    <line x1="292" y1="265" x2="377" y2="275" stroke="#047857" stroke-width="6" stroke-linecap="round" opacity="0.75" />

    <!-- Glowing Checkmark / Star Above Quran -->
    <circle cx="256" cy="105" r="32" fill="url(#goldGrad)" filter="url(#shadow)" />
    <path d="M 244 105 L 252 113 L 268 97" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
